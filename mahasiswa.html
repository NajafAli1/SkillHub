<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mahasiswa — SkillHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20260608">
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand">Skill<span>Hub</span></span>
    <div class="navbar-user">
      <span class="navbar-greeting">Hai, <strong id="namaPanggilan">Mahasiswa</strong></span>
      <button id="themeToggle" class="theme-toggle" aria-label="Ganti tema" title="Ganti tema">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
      <button onclick="logout()" class="btn btn-ghost btn-sm">Keluar</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1>Temukan Pekerjaan Impianmu</h1>
        <p>Jelajahi lowongan terbaru dan kirimkan lamaran terbaikmu.</p>
      </div>

    <div id="wadahLamar" class="lamar-panel">
      <h3 style="margin-bottom: 18px; color: var(--primary);">✉ Kirim Lamaran</h3>
      <form id="formLamarKerja">
        <input type="hidden" id="lamar_id_pekerjaan">
        <div class="form-group">
          <label for="pesan_pelamar">Cover Letter — Pesan untuk Client</label>
          <textarea id="pesan_pelamar" rows="5" placeholder="Jelaskan skill kamu, pengalaman relevan, dan kenapa kamu adalah kandidat terbaik untuk posisi ini..." required></textarea>
        </div>
        <div class="job-card-actions">
          <button type="submit" class="btn btn-success">Kirim Lamaran</button>
          <button type="button" onclick="batalLamar()" class="btn btn-ghost">Batal</button>
        </div>
      </form>
    </div>

    <div class="section-header">
      <span class="section-title">Lowongan Tersedia</span>
    </div>
    <div class="toolbar">
      <input type="search" id="searchLoker" class="search-input" placeholder="Cari judul atau deskripsi pekerjaan...">
      <select id="filterStatusLoker" class="filter-select">
        <option value="semua">Semua Status</option>
        <option value="dibuka">Buka</option>
        <option value="ditutup">Tutup</option>
      </select>
    </div>
    <div id="daftarLoker">
      <div class="loading-state">
        <div class="spinner"></div>
        Memuat lowongan...
      </div>
    </div>

    <hr>

    <div class="section-header">
      <span class="section-title">Status Lamaran Saya</span>
    </div>
    <div id="statusLamaran">
      <div class="loading-state">
        <div class="spinner"></div>
        Memuat data lamaran...
      </div>
    </div>
  </div>
  </main>

  <script src="js/ui-helpers.js?v=20260731"></script>
  <script src="js/theme.js?v=20260731"></script>
  <script src="js/mahasiswa.js?v=20260731"></script>
</body>
</html>
